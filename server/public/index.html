<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aether Remote · 实时工作台</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0b0b0f;
    --panel: #14141b;
    --panel-2: #1b1b24;
    --text: #e8e8f0;
    --muted: #8b8b9c;
    --accent: #9b5cff;
    --ok: #3ecf8e;
    --warn: #f5a524;
    --err: #ff5c7a;
    --border: #26263a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", "PingFang SC", sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #1b1030 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    padding: 18px 22px; border-bottom: 1px solid var(--border);
    background: color-mix(in oklab, var(--panel) 80%, transparent);
    position: sticky; top: 0; backdrop-filter: blur(10px); z-index: 2;
  }
  h1 { font-size: 16px; margin: 0 12px 0 0; letter-spacing: .3px; }
  h1 span { color: var(--accent); }
  .field { display: flex; align-items: center; gap: 6px; }
  input {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 7px 10px; font: inherit; min-width: 180px;
  }
  input:focus { outline: 2px solid color-mix(in oklab, var(--accent) 50%, transparent); }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: .5; cursor: default; }
  .status { margin-left: auto; display: flex; gap: 10px; align-items: center; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .dot.err { background: var(--err); }
  main { display: grid; grid-template-columns: 1fr 320px; gap: 16px; padding: 16px 22px 40px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .stream {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; height: calc(100vh - 140px); overflow: auto;
  }
  .row { display: flex; gap: 10px; padding: 7px 4px; border-bottom: 1px dashed color-mix(in oklab, var(--border) 70%, transparent); }
  .row:last-child { border-bottom: 0; }
  .badge {
    flex: 0 0 auto; font-size: 11px; padding: 2px 7px; border-radius: 999px;
    background: var(--panel-2); color: var(--muted); height: fit-content; white-space: nowrap;
  }
  .badge.text { color: var(--ok); }
  .badge.thinking { color: var(--accent); }
  .badge.tool { color: var(--warn); }
  .badge.error { color: var(--err); }
  .body { white-space: pre-wrap; word-break: break-word; }
  aside { display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
  dl { margin: 0; display: grid; grid-template-columns: 92px 1fr; gap: 4px 10px; font-size: 12px; }
  dt { color: var(--muted); }
  dd { margin: 0; word-break: break-all; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<header>
  <h1>Aether <span>Remote</span></h1>
  <div class="field"><input id="token" type="password" placeholder="访问令牌 token" /></div>
  <div class="field"><input id="workspace" value="default" placeholder="workspace" /></div>
  <button id="connect">连接</button>
  <button id="disconnect" class="ghost" disabled>断开</button>
  <div class="status">
    <span class="dot" id="dot"></span><span id="status">未连接</span>
  </div>
</header>
<main>
  <section class="stream" id="stream">
    <div class="empty">连接后，这里会实时显示 Agent 的工作内容。</div>
  </section>
  <aside>
    <div class="card">
      <h2>服务器</h2>
      <dl id="serverInfo"><dt>状态</dt><dd>未连接</dd></dl>
    </div>
    <div class="card">
      <h2>工作区</h2>
      <dl id="workspaceInfo"><dt>路径</dt><dd>—</dd></dl>
    </div>
    <div class="card">
      <h2>会话</h2>
      <dl id="sessionInfo"><dt>当前会话</dt><dd>—</dd></dl>
    </div>
  </aside>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const stream = $("stream");
  let socket = null;
  let started = false;
  let pending = new Map();
  let requestSeq = 0;
  const params = new URLSearchParams(location.search);
  if (params.get("workspace")) $("workspace").value = params.get("workspace");

  function setStatus(text, kind) {
    $("status").textContent = text;
    $("dot").className = "dot" + (kind ? " " + kind : "");
  }

  function append(kind, label, text) {
    if (!started) { stream.innerHTML = ""; started = true; }
    const row = document.createElement("div");
    row.className = "row";
    const badge = document.createElement("span");
    badge.className = "badge " + kind;
    badge.textContent = label;
    const body = document.createElement("div");
    body.className = "body";
    body.textContent = text;
    row.append(badge, body);
    stream.append(row);
    stream.scrollTop = stream.scrollHeight;
  }

  function info(target, entries) {
    const list = $(target);
    list.innerHTML = "";
    for (const [key, value] of entries) {
      const dt = document.createElement("dt");
      dt.textContent = key;
      const dd = document.createElement("dd");
      dd.textContent = value ?? "—";
      list.append(dt, dd);
    }
  }

  function send(frame) {
    if (!socket || socket.readyState !== WebSocket.OPEN) return null;
    const id = frame.id ?? `dash-${++requestSeq}`;
    socket.send(JSON.stringify({ ...frame, id }));
    return id;
  }

  function handleEvent(frame) {
    const { event, payload = {} } = frame;
    switch (event) {
      case "text_delta":
        append("text", "回答", payload.text ?? "");
        break;
      case "thinking_delta":
        append("thinking", "思考", payload.text ?? "");
        break;
      case "tool_call_start":
        append("tool", "工具", `${payload.name ?? "tool"}`);
        break;
      case "tool_call_end":
        append("tool", "结果", (payload.output_json ?? "").toString().slice(0, 2000));
        break;
      case "process_start":
        append("tool", "命令", payload.command ?? "");
        break;
      case "process_chunk": {
        const bytes = payload.bytes_base64 ? atob(payload.bytes_base64) : "";
        if (bytes) append("tool", "输出", bytes);
        break;
      }
      case "server_status":
        setStatus(payload.bridge === "running" ? "Bridge 运行中" : `Bridge ${payload.bridge ?? ""}`, payload.bridge === "running" ? "on" : "");
        break;
      case "journal_replay":
        append("thinking", "回放", payload.event || payload.type || "");
        break;
      default:
        if (payload.session_id) info("sessionInfo", [["当前会话", payload.session_id]]);
        break;
    }
  }

  function connect() {
    const token = $("token").value.trim();
    const workspace = $("workspace").value.trim() || "default";
    if (!token) { setStatus("请填写访问令牌", "err"); return; }
    const scheme = location.protocol === "https:" ? "wss" : "ws";
    socket = new WebSocket(`${scheme}://${location.host}/v1/agent`);
    setStatus("连接中…");
    socket.onopen = () => {
      socket.send(JSON.stringify({
        type: "hello",
        protocol: 1,
        token,
        workspace,
        client: { name: "aether-dashboard", platform: "web" },
      }));
    };
    socket.onmessage = (message) => {
      let frame;
      try { frame = JSON.parse(message.data); } catch { return; }
      if (frame.type === "hello") {
        if (!frame.ok) { setStatus(`握手失败: ${frame.error?.message ?? ""}`, "err"); return; }
        setStatus("已连接", "on");
        $("connect").disabled = true;
        $("disconnect").disabled = false;
        info("serverInfo", [
          ["版本", frame.server_version],
          ["用户", frame.user],
          ["工作区", frame.workspace],
          ["Bridge", frame.bridge?.running ? `运行中 (pid ${frame.bridge.pid})` : "启动中"],
        ]);
        info("workspaceInfo", [
          ["HOME", frame.paths?.home],
          ["WORKSPACE", frame.paths?.workspace],
          ["AGENT", frame.paths?.agent],
        ]);
        return;
      }
      if (frame.type === "event") { handleEvent(frame); return; }
      if (frame.type === "error") { append("error", "错误", frame.error?.message ?? ""); }
    };
    socket.onclose = (event) => {
      setStatus(`已断开 (${event.code})`);
      $("connect").disabled = false;
      $("disconnect").disabled = true;
      socket = null;
    };
    socket.onerror = () => setStatus("连接错误", "err");
  }

  function disconnect() {
    socket?.close(1000, "dashboard disconnect");
  }

  $("connect").onclick = connect;
  $("disconnect").onclick = disconnect;
  $("token").addEventListener("keydown", (event) => { if (event.key === "Enter") connect(); });
})();
</script>
</body>
</html>
