# The ACP profile runs the agent for the Aether phone app.
#
# The provider routes are merged in from the host's web profile when the
# harness is started (see server/src/dsh-bridge/acp-patch.mjs), so the phone's
# model list and the agent's routes always agree and every route the phone can
# pick resolves its credential. What is left here are the defaults of the ACP
# profile itself; they are replaced by the host's default model whenever the
# host's web profile names a route this profile does not have.
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-v4-flash
- id: acp
  config:
    provider: deepseek-official
    model: deepseek-v4-flash
